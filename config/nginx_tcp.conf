# 需要编译/安装带 stream 模块的 nginx。
# 示例：client -> nginx:8000 -> ChatServer:6000/6002
stream {
    upstream chatserver_cluster {
        server 127.0.0.1:6000 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6002 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;
        proxy_connect_timeout 3s;
        proxy_timeout 60s;
        proxy_pass chatserver_cluster;
    }
}
